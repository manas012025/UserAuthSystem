name: Docker Build -> pull -> deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '17'

    - name: Build jar
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests

    - name: Login DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest
      
    - name: SSH and deploy to EC2 (Zero Downtime)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |

          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest

          echo "Pull latest image"
          docker pull $IMAGE

          echo "Check current running container"
          CURRENT=$(docker ps --filter "name=userauthsystem" --format "{{.Names}}")

          if [ "$CURRENT" == "userauthsystem-blue" ]; then
            NEW="userauthsystem-green"
            OLD="userauthsystem-blue"
            PORT=8081
          else
            NEW="userauthsystem-blue"
            OLD="userauthsystem-green"
            PORT=8082
          fi

          echo "Starting new container: $NEW on port $PORT"
          docker run -d --name $NEW -p $PORT:8080 $IMAGE

          echo "Waiting for app to be ready..."
          sleep 15\          

          echo "Switching traffic (update nginx if used)"

          # OPTIONAL: If using NGINX reverse proxy, reload here

          echo "Stopping old container: $OLD"
          docker stop $OLD || true
          docker rm $OLD || true

          echo "Cleaning unused Docker images"
          docker image prune -af
