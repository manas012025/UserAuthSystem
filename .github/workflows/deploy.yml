name: Docker Build -> Zero Downtime Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build JAR
      run: |
        chmod +x ./mvnw
        ./mvnw clean package -DskipTests

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest

    - name: Deploy to EC2 (Zero Downtime)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_KEY }}
        script: |

          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/userauthsystem:latest

          echo "Pull latest image"
          docker pull $IMAGE

          echo "Check current running container"
          CURRENT=$(docker ps --filter "name=userauthsystem" --format "{{.Names}}")

          if [ "$CURRENT" == "userauthsystem-blue" ]; then
            NEW="userauthsystem-green"
            OLD="userauthsystem-blue"
            PORT=8082
          else
            NEW="userauthsystem-blue"
            OLD="userauthsystem-green"
            PORT=8081
          fi

          echo "Starting new container: $NEW on port $PORT"
          docker run -d --name $NEW -p $PORT:8080 $IMAGE

          echo "Waiting for app to be ready..."
          sleep 20

          echo "Health check..."
          curl -f http://localhost:$PORT/actuator/health || exit 1

          echo "Switching Nginx to port $PORT"
          sudo sed -i "s/server 127.0.0.1:.*/server 127.0.0.1:$PORT;/" /etc/nginx/conf.d/upstream.conf

          sudo nginx -t
          sudo systemctl reload nginx

          echo "Stopping old container: $OLD"
          docker stop $OLD || true
          docker rm $OLD || true

          echo "Cleanup old images"
          docker image prune -af
